<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Dynamique : avant compression, l'écart entre les passages faibles et les crêtes est large ; après compression, les crêtes baissent et les passages faibles remontent">

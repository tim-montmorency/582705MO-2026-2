<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Codec : le signal PCM entre dans l'encodeur ; en sortie WAV sans compression, FLAC sans perte et Opus avec perte, du plus lourd au plus léger">
  <title>Le codec — encoder pour transmettre</title>
  <style>
    .titre { font:700 15px sans-serif; fill:#3c4043; }
    .sous { font:13px sans-serif; fill:#5f6368; }
    .note { font:13px sans-serif; fill:#5f6368; }
    .lbl { font:12px sans-serif; fill:#3c4043; }
    .lbl-b { font:700 12px sans-serif; fill:#3c4043; }
    .petit { font:11px sans-serif; fill:#5f6368; }
    .vr { fill:#6aa84f; }
    .rr { fill:#b81c1c; }
    .axe { stroke:#9aa0a6; stroke-width:2; fill:none; }
    .grille { stroke:#e8eaed; stroke-width:1; }
    .niv { stroke:#dadce0; stroke-width:1; }
    .repere { stroke:#3c4043; stroke-width:2; stroke-dasharray:5 4; }
    .c1 { fill:none; stroke:#b81c1c; stroke-width:2.5; }
    .c2 { fill:none; stroke:#2a6fdb; stroke-width:2.5; }
    .c3 { fill:none; stroke:#6aa84f; stroke-width:2.5; }
    .point { fill:#b81c1c; }
    .pt1 { fill:#b81c1c; }
    .pt2 { fill:#e69138; }
    .pt3 { fill:#6aa84f; }
    .chip1 { fill:#b81c1c; }
    .chip2 { fill:#e69138; }
    .chip3 { fill:#6aa84f; }
  
    /* variante sombre : le site suit prefers-color-scheme */
    @media (prefers-color-scheme: dark) {
      .axe { fill:none; stroke:#7c7c94; }
      .c1 { fill:none; stroke:#e08181; }
      .c2 { fill:none; stroke:#7aa7ee; }
      .c3 { fill:none; stroke:#8fce74; }
      .chip1 { fill:#e08181; }
      .chip2 { fill:#eda85c; }
      .chip3 { fill:#8fce74; }
      .grille { stroke:#2b2b3c; }
      .lbl { fill:#dcdcea; }
      .lbl-b { fill:#dcdcea; }
      .niv { stroke:#35354a; }
      .note { fill:#b3b3c6; }
      .petit { fill:#b3b3c6; }
      .point { fill:#e08181; }
      .pt1 { fill:#e08181; }
      .pt2 { fill:#eda85c; }
      .pt3 { fill:#8fce74; }
      .repere { stroke:#dcdcea; }
      .rr { fill:#e08181; }
      .sous { fill:#b3b3c6; }
      .titre { fill:#dcdcea; }
      .vr { fill:#8fce74; }
      [fill="#2a6fdb"] { fill:#7aa7ee; }
      [fill="#3c4043"] { fill:#dcdcea; }
      [fill="#6aa84f"] { fill:#8fce74; }
      [fill="#b81c1c"] { fill:#e08181; }
      [fill="#f1f3f4"] { fill:#21212e; }
      [fill="#fce8e6"] { fill:#33222a; }
      [stroke="#9aa0a6"] { stroke:#7c7c94; }
      [stroke="#b81c1c"] { stroke:#e08181; }
    }
  </style>
  <text class="titre" x="360" y="26" text-anchor="middle">Le codec — encoder pour transmettre</text>
  <text class="sous" x="360" y="46" text-anchor="middle">un algorithme qui compresse le signal ; avec perte, il retire ce que l'oreille n'entend pas</text>
  <rect x="60" y="106" width="150" height="70" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="2"/>
  <text class="lbl-b" x="135" y="136" text-anchor="middle">Signal</text>
  <text class="petit" x="135" y="156" text-anchor="middle">PCM — 48 kHz / 24 bits</text>
  <path class="axe" d="M 215 141 H 265"/><path d="M 265 141 l -10 -6 v12 z" fill="#3c4043"/>
  <rect x="275" y="106" width="140" height="70" rx="10" fill="#fce8e6" stroke="#b81c1c" stroke-width="2"/>
  <text class="lbl-b" x="345" y="136" text-anchor="middle">Codec</text>
  <text class="petit" x="345" y="156" text-anchor="middle">FLAC, Opus, AAC…</text>
  <path class="axe" d="M 420 105 H 448"/><path d="M 448 105 l -8 -5 v10 z" fill="#3c4043"/>
  <text class="petit" x="460" y="88">WAV — sans compression (référence)</text>
  <rect x="460" y="92" width="240" height="14" rx="3" fill="#2a6fdb"/>
  <path class="axe" d="M 420 141 H 448"/><path d="M 448 141 l -8 -5 v10 z" fill="#3c4043"/>
  <text class="petit" x="460" y="124">FLAC — sans perte, compressé</text>
  <rect x="460" y="128" width="130" height="14" rx="3" fill="#6aa84f"/>
  <path class="axe" d="M 420 177 H 448"/><path d="M 448 177 l -8 -5 v10 z" fill="#3c4043"/>
  <text class="petit" x="460" y="160">Opus — avec perte, léger</text>
  <rect x="460" y="164" width="56" height="14" rx="3" fill="#b81c1c"/>
  <text class="note" x="360" y="236" text-anchor="middle">Sans perte pour l'archive ; avec perte pour la diffusion — le choix dépend de l'usage.</text>
</svg>

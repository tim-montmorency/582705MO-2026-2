<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Un titre apparaît en fondu, puis s'efface">
  <title>Le titre et le fondu — sobriété et lisibilité</title>
  <style>
    .cadre { fill:#1b1b1b; }
    .titre { font:700 44px sans-serif; fill:#ffffff; }
    .sous { font:20px sans-serif; fill:#d0d0d0; }
    .note { font:13px sans-serif; fill:#5f6368; }
  </style>

  <!-- « écran » -->
  <rect class="cadre" x="40" y="30" width="640" height="160" rx="8"/>

  <!-- Titre : fondu entrée → maintien → sortie -->
  <g>
    <text class="titre" x="360" y="105" text-anchor="middle">TITRE</text>
    <text class="sous"  x="360" y="140" text-anchor="middle">sous-titre</text>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Le fond « coupe » vers le noir : le fondu -->
  <rect x="40" y="30" width="640" height="160" rx="8" fill="#000000" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.5;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- barre de temps du fondu -->
  <g>
    <rect x="40" y="205" width="640" height="10" rx="5" fill="#e0e0e0"/>
    <rect x="40" y="205" width="0" height="10" rx="5" fill="#b81c1c">
      <animate attributeName="width" values="0;640;640;0;0" keyTimes="0;0.15;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text class="note" x="360" y="240" text-anchor="middle">fondu d'entrée → maintien → fondu de sortie</text>
  </g>
</svg>

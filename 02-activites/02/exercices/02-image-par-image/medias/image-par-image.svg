<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Six trames successives montrent une balle qui rebondit, image par image">
  <title>L'animation image par image — une image à la fois</title>
  <style>
    .trame { fill:#ffffff; stroke:#9aa0a6; stroke-width:2; }
    .balle { fill:#b81c1c; }
    .ghost { fill:#b81c1c; opacity:0.18; }
    .sol { stroke:#c9ccd1; stroke-width:3; }
    .num { font:13px sans-serif; fill:#5f6368; }
  </style>

  <!-- 6 trames côte à côte, la balle à des hauteurs différentes -->
  <g>
    <rect class="trame" x="20"  y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="70"  cy="150" r="12"/>
    <line class="sol" x1="30" y1="168" x2="110" y2="168"/>
    <text class="num" x="70"  y="205" text-anchor="middle">1</text>
  </g>
  <g>
    <rect class="trame" x="130" y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="180" cy="80"  r="12"/>
    <line class="sol" x1="140" y1="168" x2="220" y2="168"/>
    <text class="num" x="180" y="205" text-anchor="middle">2</text>
  </g>
  <g>
    <rect class="trame" x="240" y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="290" cy="140" r="12"/>
    <line class="sol" x1="250" y1="168" x2="330" y2="168"/>
    <text class="num" x="290" y="205" text-anchor="middle">3</text>
  </g>
  <g>
    <rect class="trame" x="350" y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="400" cy="120" r="12"/>
    <line class="sol" x1="360" y1="168" x2="440" y2="168"/>
    <text class="num" x="400" y="205" text-anchor="middle">4</text>
  </g>
  <g>
    <rect class="trame" x="460" y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="510" cy="95"  r="12"/>
    <line class="sol" x1="470" y1="168" x2="550" y2="168"/>
    <text class="num" x="510" y="205" text-anchor="middle">5</text>
  </g>
  <g>
    <rect class="trame" x="570" y="30" width="100" height="150" rx="6"/>
    <circle class="balle" cx="620" cy="150" r="12"/>
    <line class="sol" x1="580" y1="168" x2="660" y2="168"/>
    <text class="num" x="620" y="205" text-anchor="middle">6</text>
  </g>

  <!-- la trame « courante » est surlignée, en boucle -->
  <g fill="none" stroke="#b81c1c" stroke-width="3">
    <rect x="20" y="30" width="100" height="150" rx="6">
      <animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="130" y="30" width="100" height="150" rx="6" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="30" width="100" height="150" rx="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="350" y="30" width="100" height="150" rx="6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="30" width="100" height="150" rx="6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="570" y="30" width="100" height="150" rx="6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16;0.32;0.48;0.64;0.82;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="num" x="360" y="240" text-anchor="middle">chaque trame est dessinée une par une — puis défile</text>
</svg>

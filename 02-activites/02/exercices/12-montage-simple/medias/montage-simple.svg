<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Des blocs de trames se déplacent sur une timeline pour former une séquence">
  <title>Le montage simple — ordonner les images sur la timeline</title>
  <style>
    .piste { fill:#f1f3f4; }
    .clip  { fill:#b81c1c; }
    .clip2 { fill:#2a6fdb; }
    .clip3 { fill:#2e7d32; }
    .clip4 { fill:#c77700; }
    .num { font:14px sans-serif; fill:#3c4043; }
    .note { font:13px sans-serif; fill:#5f6368; }
    .regle { stroke:#c9ccd1; stroke-width:2; }
  </style>

  <!-- pistes -->
  <rect class="piste" x="60" y="60"  width="620" height="46" rx="6"/>
  <rect class="piste" x="60" y="116" width="620" height="46" rx="6"/>

  <!-- clips, la séquence s'assemble -->
  <g>
    <rect class="clip" x="60" y="60" width="120" height="46" rx="6"/>
    <text class="num" x="120" y="88" text-anchor="middle" fill="#fff">A</text>
  </g>
  <g>
    <rect class="clip2" x="180" y="60" width="120" height="46" rx="6" opacity="0">
      <animate attributeName="opacity" begin="0.6s" to="1" dur="0.4s" fill="freeze"/>
    </rect>
    <text class="num" x="240" y="88" text-anchor="middle" fill="#fff" opacity="0">B
      <animate attributeName="opacity" begin="0.6s" to="1" dur="0.4s" fill="freeze"/>
    </text>
  </g>
  <g>
    <rect class="clip3" x="300" y="60" width="120" height="46" rx="6" opacity="0">
      <animate attributeName="opacity" begin="1.2s" to="1" dur="0.4s" fill="freeze"/>
    </rect>
    <text class="num" x="360" y="88" text-anchor="middle" fill="#fff" opacity="0">C
      <animate attributeName="opacity" begin="1.2s" to="1" dur="0.4s" fill="freeze"/>
    </text>
  </g>
  <g>
    <rect class="clip4" x="420" y="60" width="120" height="46" rx="6" opacity="0">
      <animate attributeName="opacity" begin="1.8s" to="1" dur="0.4s" fill="freeze"/>
    </rect>
    <text class="num" x="480" y="88" text-anchor="middle" fill="#fff" opacity="0">D
      <animate attributeName="opacity" begin="1.8s" to="1" dur="0.4s" fill="freeze"/>
    </text>
  </g>

  <!-- un bloc se déplace : le réordonnancement -->
  <g>
    <rect x="560" y="116" width="100" height="46" rx="6" fill="#b81c1c" opacity="0.5"/>
    <text class="num" x="610" y="144" text-anchor="middle" fill="#fff">D</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -140 0; -140 0; 0 0" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- règle de temps -->
  <line class="regle" x1="60" y1="185" x2="680" y2="185"/>
  <g class="num" text-anchor="middle">
    <text x="60"  y="205">0 s</text>
    <text x="215" y="205">1 s</text>
    <text x="370" y="205">2 s</text>
    <text x="525" y="205">3 s</text>
    <text x="680" y="205">4 s</text>
  </g>

  <text class="note" x="360" y="245" text-anchor="middle">on assemble les images, on pose les tenues, on règle le rythme — l'ordre crée le sens</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Une roue de chargement tourne en boucle">
  <title>La boucle de chargement — une rotation parfaite</title>
  <circle cx="110" cy="110" r="62" fill="none" stroke="#b81c1c" stroke-opacity="0.15" stroke-width="18"/>
  <g>
    <path d="M110 48 A62 62 0 0 1 172 110" fill="none" stroke="#b81c1c" stroke-width="18" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 110 110" to="360 110 110" dur="1.1s" repeatCount="indefinite"/>
  </g>
</svg>

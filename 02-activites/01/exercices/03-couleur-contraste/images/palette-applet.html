<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur de palettes — Krita</title>
<style>
:root {
  --bg:#ffffff; --text:#1a1a2e; --border:#e2e2e6; --muted:#888888;
  --accent:#b81c1c; --ok:#2a7a2a; --warn:#c07800; --err:#8b0000;
  --soft:#f5f5f8; --mono:ui-monospace,'Cascadia Code','Source Code Pro',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#12121a; --text:#d0d0e0; --border:#2a2a3a; --muted:#808098; --accent:#d47676; --soft:#1a1a26; }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,sans-serif; font-size:15px; font-weight:350; line-height:1.6; background:var(--bg); color:var(--text); padding:16px; }

/* contrôles */
.pick { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.pick label { font-size:14px; font-weight:350; color:var(--text); }
.pick input[type="color"] { width:40px; height:34px; border:1px solid var(--border); border-radius:var(--border-radius,3px); cursor:pointer; padding:1px; background:var(--bg); }
.pick code { font-family:var(--mono); font-size:13px; color:var(--text); background:var(--soft); padding:3px 8px; border-radius:var(--border-radius,3px); cursor:pointer; border:1px solid transparent; }
.pick code:hover { border-color:var(--accent); }

.strats { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px; }
.strats label { cursor:pointer; }
.strats input { position:absolute; opacity:0; pointer-events:none; }
.strats span { display:inline-flex; flex-direction:column; gap:1px; padding:7px 13px; border-radius:var(--border-radius,3px); font-size:13px; color:var(--muted); background:transparent; border:1px solid transparent; transition:color .15s,border-color .15s; }
.strats span b { font-size:13px; font-weight:350; }
.strats span small { font-size:10px; opacity:.55; }
.strats input:checked + span { color:var(--text); border-color:var(--accent); background:var(--soft); }
.strats input:checked + span b { font-weight:600; }

/* palette */
.palette { display:flex; gap:0; flex-wrap:wrap; border-radius:var(--border-radius,3px); overflow:hidden; border:1px solid var(--border); margin-bottom:14px; }
.palette .sw { flex:1; min-width:0; display:flex; flex-direction:column; }
.palette .sw .color { padding:18px 8px 10px; text-align:center; flex:1; min-height:72px; }
.palette .sw .color .label { font-size:10px; opacity:.4; margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
.palette .sw .color .hex { font-family:var(--mono); font-size:12px; font-weight:400; cursor:pointer; padding:2px 5px; border-radius:2px; display:inline-block; }
.palette .sw .color .hex:hover { background:rgba(255,255,255,.2); }
.palette .sw .color .rgb { font-size:9px; opacity:.35; margin-top:2px; font-family:var(--mono); }
.palette .sw .gray { padding:6px; text-align:center; }
.palette .sw .gray .hex { font-family:var(--mono); font-size:10px; cursor:pointer; padding:2px 5px; border-radius:2px; display:inline-block; }

/* status */
.status { font-size:13px; min-height:20px; margin-bottom:14px; }
.status .bar-label { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.status .bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.status .bar div { height:100%; border-radius:2px; }

/* sauvegarde */
.save { margin-top:0; }
.save .label { font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px; }
.save .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.save .row input { flex:1; min-width:120px; padding:5px 8px; border:1px solid var(--border); border-radius:var(--border-radius,3px); font-size:13px; background:var(--bg); color:var(--text); }
.save .row button { padding:5px 12px; border:1px solid var(--border); border-radius:var(--border-radius,3px); font-size:13px; cursor:pointer; background:var(--bg); color:var(--text); }
.save .row button:hover { border-color:var(--accent); color:var(--accent); }

.saved { margin-top:8px; }
.saved .row { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid var(--border); }
.saved .swatches { display:flex; gap:2px; }
.saved .swatches div { width:18px; height:18px; border-radius:2px; border:1px solid var(--border); }
.saved .name { flex:1; font-size:13px; color:var(--text); margin-left:2px; }
.saved .strat { font-size:10px; color:var(--muted); }
.saved button { border:1px solid var(--border); border-radius:2px; padding:2px 7px; font-size:11px; cursor:pointer; background:transparent; color:var(--text); }
.saved .empty { font-size:11px; color:var(--muted); padding:2px 0; }
</style>
</head>
<body>

<div class="pick">
<label>Couleur de base
<input type="color" id="pa-base" value="#e05c3a">
<code id="pa-hex">#E05C3A</code>
</label>
</div>

<div class="strats" id="pa-strats"></div>

<div class="palette" id="pa-grid"></div>
<div class="status" id="pa-status"></div>

<div class="save">
<div class="label">Sauvegarder / charger (cet appareil)</div>
<div class="row">
<input type="text" id="pa-save-name" placeholder="Nom…">
<button id="pa-save-btn">Sauvegarder</button>
</div>
<div class="saved" id="pa-saved"></div>
</div>

<script>
(function() {
  function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;var a=s*Math.min(l,1-l);function f(n){var k=(n+h/30)%12;var c=l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));return Math.round(255*c).toString(16).padStart(2,'0');}return'#'+f(0)+f(8)+f(4);}
  function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function toGray(h){var c=hex2rgb(h);var v=Math.round(.299*c[0]+.587*c[1]+.114*c[2]);var x=v.toString(16).padStart(2,'0');return'#'+x+x+x;}
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);}s=Math.round(s*100);l=Math.round(l*100);return[h,s,l];}
  function lum(hex){var c=hex2rgb(hex);return .299*c[0]+.587*c[1]+.114*c[2];}

  var STRATS=[
    {name:'Compl\u00E9mentaire',desc:'H+180\u00B0',gen:function(h,s,l){return[hsl2hex(h,s,l),hsl2hex(h+180,s,l)];},labels:['Base','Compl\u00E9ment']},
    {name:'Analogue',desc:'H\u00B130\u00B0',gen:function(h,s,l){return[hsl2hex(h-30,s,l),hsl2hex(h,s,l),hsl2hex(h+30,s,l)];},labels:['\u221230\u00B0','Base','+30\u00B0']},
    {name:'Monochrome',desc:'valeurs 20\u219280%',gen:function(h,s,l){return[hsl2hex(h,s,20),hsl2hex(h,s,35),hsl2hex(h,s,50),hsl2hex(h,s,65),hsl2hex(h,s,80)];},labels:['Ombre','Fonc\u00E9','M\u00E9dium','Clair','Tr\u00E8s clair']},
    {name:'Triade',desc:'H+120\u00B0/+240\u00B0',gen:function(h,s,l){return[hsl2hex(h,s,l),hsl2hex(h+120,s,l),hsl2hex(h+240,s,l)];},labels:['0\u00B0','+120\u00B0','+240\u00B0']},
    {name:'Cama\u00EFeu',desc:'6 valeurs / 2 teintes',gen:function(h,s,l){return[hsl2hex(h,s,35),hsl2hex(h,s,55),hsl2hex(h,s,75),hsl2hex(h+180,s,35),hsl2hex(h+180,s,55),hsl2hex(h+180,s,75)];},labels:['F','M','C','F','M','C']},
    {name:'Carr\u00E9',desc:'4 points \u00E0 90\u00B0',gen:function(h,s,l){return[hsl2hex(h,s,l),hsl2hex(h+90,s,l),hsl2hex(h+180,s,l),hsl2hex(h+270,s,l)];},labels:['0\u00B0','+90\u00B0','+180\u00B0','+270\u00B0']}
  ];
  var currentStrat=0,saved={};

  function buildStrats(){
    var c=document.getElementById('pa-strats');
    c.innerHTML='';
    STRATS.forEach(function(s,i){
      var lb=document.createElement('label');
      lb.innerHTML='<input type="radio" name="strat" value="'+i+'"'+(i===currentStrat?' checked':'')+'><span><b>'+s.name+'</b><small>'+s.desc+'</small></span>';
      lb.querySelector('input').addEventListener('change',function(){currentStrat=i;updateStratStyle();render();});
      c.appendChild(lb);
    });
    updateStratStyle();
  }
  function updateStratStyle(){
    document.querySelectorAll('#pa-strats label').forEach(function(lb,i){
      var sp=lb.querySelector('span');
      if(i===currentStrat){sp.style.borderColor='var(--accent)';sp.style.color='var(--text)';sp.style.background='var(--soft)';}
      else{sp.style.borderColor='transparent';sp.style.color='var(--muted)';sp.style.background='transparent';}
    });
  }

  function render(){
    var baseEl=document.getElementById('pa-base');
    if(!baseEl)return;
    var base=baseEl.value;
    var hsl=rgb2hsl.apply(null,hex2rgb(base));
    var hue=hsl[0],s=Math.max(hsl[1],30),l=Math.max(Math.min(hsl[2],72),28);
    var strat=STRATS[currentStrat];
    var colors=strat.gen(hue,s,l);
    var grid=document.getElementById('pa-grid');
    if(!grid)return;
    grid.innerHTML='';
    var minL=255,maxL=0;
    colors.forEach(function(c,i){
      var g=toGray(c),rgb=hex2rgb(c),Lv=Math.round(lum(c));
      if(Lv<minL)minL=Lv;if(Lv>maxL)maxL=Lv;
      var txtC=Lv>128?'var(--text)':'var(--bg)';
      var sw=document.createElement('div');
      sw.className='sw';
      sw.innerHTML='<div class="color" style="background:'+c+';">'+
        '<div class="label">'+(strat.labels[i]||'')+'</div>'+
        '<div class="hex" data-color="'+c.toUpperCase()+'" title="Cliquer pour copier">'+c.toUpperCase()+'</div>'+
        '<div class="rgb">rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')</div></div>'+
        '<div class="gray" style="background:'+g+';"><div class="hex" data-color="'+g.toUpperCase()+'" title="Cliquer pour copier">'+g.toUpperCase()+'</div></div>';
      grid.appendChild(sw);
    });
    grid.querySelectorAll('.hex').forEach(function(el){
      el.addEventListener('click',function(){
        navigator.clipboard.writeText(this.dataset.color);
        this.textContent='COPI\u00C9 \u2713';
        var s=this;setTimeout(function(){s.textContent=s.dataset.color;},900);
      });
    });
    var diff=maxL-minL;
    var status=document.getElementById('pa-status');
    if(!status)return;
    var pct=Math.round(diff/255*100);
    var bc=diff>=60?'var(--ok)':diff>=35?'var(--warn)':'var(--err)';
    var bl=diff>=60?'\u2713 Hi\u00E9rarchie lisible en gris':diff>=35?'\u26A0 Limite':'\u2717 Le sujet s\u2019efface en gris';
    status.innerHTML=bl+' \u2014 \u00E9cart '+diff+'/255 ('+pct+'%)'+
      '<div class="bar"><div style="background:'+bc+';height:100%;width:'+pct+'%;"></div></div>';
  }

  function renderSaved(){
    var list=document.getElementById('pa-saved');
    if(!list)return;
    var keys=Object.keys(saved);
    if(!keys.length){list.innerHTML='<div class="empty">Aucune palette sauvegard\u00E9e.</div>';return;}
    list.innerHTML='';
    keys.forEach(function(name){
      var p=saved[name];
      var row=document.createElement('div');
      row.className='row';
      row.innerHTML=p.colors.map(function(c){return '<div class="swatches"><div style="width:18px;height:18px;background:'+c+';border-radius:2px;border:1px solid var(--border);"></div></div>';}).join('')+
        '<div class="name">'+name+'</div>'+
        '<div class="strat">'+p.strat+'</div>'+
        '<button class="load" data-name="'+name+'">Charger</button>'+
        '<button class="del" data-name="'+name+'">\u00D7</button>';
      list.appendChild(row);
    });
    list.querySelectorAll('.load').forEach(function(btn){
      btn.addEventListener('click',function(){
        var p=saved[this.dataset.name];
        document.getElementById('pa-base').value=p.base;
        var idx=STRATS.findIndex(function(s){return s.name===p.strat;});
        if(idx>=0){currentStrat=idx;buildStrats();}
        render();
      });
    });
    list.querySelectorAll('.del').forEach(function(btn){
      btn.addEventListener('click',function(){
        delete saved[this.dataset.name];
        localStorage.setItem('pa-saved',JSON.stringify(saved));
        renderSaved();
      });
    });
  }
  function savePalette(){
    var nameEl=document.getElementById('pa-save-name');
    if(!nameEl)return;
    var baseEl=document.getElementById('pa-base');
    if(!baseEl)return;
    var base=baseEl.value;
    var strat=STRATS[currentStrat].name;
    var hsl=rgb2hsl.apply(null,hex2rgb(base));
    var colors=STRATS[currentStrat].gen(hsl[0],Math.max(hsl[1],30),Math.max(Math.min(hsl[2],72),28));
    var name=nameEl.value.trim()||base.replace('#','').toUpperCase()+' '+strat;
    saved[name]={base:base,strat:strat,colors:colors};
    localStorage.setItem('pa-saved',JSON.stringify(saved));
    nameEl.value='';
    renderSaved();
  }

  document.getElementById('pa-base').addEventListener('input',function(){
    document.getElementById('pa-hex').textContent=this.value.toUpperCase();
    render();
  });
  document.getElementById('pa-save-btn').addEventListener('click',savePalette);
  document.getElementById('pa-save-name').addEventListener('keydown',function(e){if(e.key==='Enter')savePalette();});

  try{saved=JSON.parse(localStorage.getItem('pa-saved')||'{}');}catch(e){saved={};}
  buildStrats();
  render();
  renderSaved();

  function resizeSelf(){
    try{
      var iframe=window.parent.document.querySelector('iframe[src*="palette-applet"]');
      if(iframe)iframe.style.height=document.documentElement.scrollHeight+'px';
    }catch(e){}
  }
  new ResizeObserver(resizeSelf).observe(document.body);
  resizeSelf();
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Voir le son : un même son analysé par un spectre de fréquences et par une forme d'onde, deux visualisations complémentaires">
  <title>Voir le son — le spectre et la forme d'onde</title>
  <style>
    .titre { font:700 17px sans-serif; fill:#3c4043; }
    .sous { font:12px sans-serif; fill:#5f6368; }
    .note { font:12px sans-serif; fill:#5f6368; }
    .lbl { font:700 11px sans-serif; fill:#3c4043; }
    .petit { font:11px sans-serif; fill:#5f6368; }
    .lblEcran { font:700 11px sans-serif; fill:#dcdcea; letter-spacing:.5px; }
    .petitEcran { font:11px sans-serif; fill:#b3b3c6; }
    .ecran { fill:#1c1c2b; }
    .bar { fill:#2a6fdb; }
    .wave { fill:none; stroke:#6aa84f; stroke-width:2.2; }
    .src { fill:none; stroke:#b81c1c; stroke-width:2.2; }
    .cadre { fill:#fce8e6; stroke:#b81c1c; stroke-width:2; }
    @media (prefers-color-scheme: dark) {
      .titre, .lbl { fill:#dcdcea; }
      .sous, .petit, .note { fill:#b3b3c6; }
      .ecran { fill:#0f0f18; }
    }
  </style>

  <text class="titre" x="360" y="27" text-anchor="middle">Voir le son</text>
  <text class="sous" x="360" y="46" text-anchor="middle">un même son, deux lectures : fréquences et dynamique</text>

  <rect class="cadre" x="24" y="88" width="48" height="48" rx="24"/>
  <path class="src" d="M 38 112 L 42 104 L 46 120 L 50 100 L 54 122 L 58 110 L 62 116"/>
  <text class="petit" x="48" y="152" text-anchor="middle">son</text>

  <rect class="ecran" x="92" y="64" width="600" height="128" rx="8"/>
  <line x1="392" y1="76" x2="392" y2="180" stroke="#3a3a4a" stroke-width="1.5"/>

  <text class="lblEcran" x="242" y="86" text-anchor="middle">SPECTRE</text>
  <g class="bar">
    <rect x="126" y="138" width="10" height="32" rx="2"/>
    <rect x="142" y="126" width="10" height="44" rx="2"/>
    <rect x="158" y="112" width="10" height="58" rx="2"/>
    <rect x="174" y="100" width="10" height="70" rx="2"/>
    <rect x="190" y="118" width="10" height="52" rx="2"/>
    <rect x="206" y="92" width="10" height="78" rx="2"/>
    <rect x="222" y="108" width="10" height="62" rx="2"/>
    <rect x="238" y="82" width="10" height="88" rx="2"/>
    <rect x="254" y="104" width="10" height="66" rx="2"/>
    <rect x="270" y="94" width="10" height="76" rx="2"/>
    <rect x="286" y="122" width="10" height="48" rx="2"/>
    <rect x="302" y="88" width="10" height="82" rx="2"/>
    <rect x="318" y="110" width="10" height="60" rx="2"/>
    <rect x="334" y="100" width="10" height="70" rx="2"/>
    <rect x="350" y="130" width="10" height="40" rx="2"/>
  </g>
  <text class="petitEcran" x="242" y="180" text-anchor="middle">fréquences · timbre</text>

  <text class="lblEcran" x="542" y="86" text-anchor="middle">FORME D'ONDE</text>
  <path class="wave" d="M 420 132 L 426 120 L 432 144 L 438 110 L 444 150 L 450 126 L 456 138 L 462 116 L 468 146 L 474 124 L 480 136 L 486 112 L 492 148 L 498 128 L 504 140 L 510 120 L 516 144 L 522 126 L 528 136 L 534 114 L 540 142 L 546 128 L 552 138 L 558 118 L 564 146 L 570 130 L 576 140 L 582 122 L 588 144 L 594 132 L 600 140 L 606 126 L 612 142 L 618 130 L 624 138 L 630 120 L 636 144 L 642 132 L 648 140 L 654 124 L 660 142"/>
  <text class="petitEcran" x="542" y="180" text-anchor="middle">dynamique · rythme</text>

  <text class="note" x="360" y="220" text-anchor="middle">Le même son, lu deux fois : le spectre montre les fréquences, la forme d'onde montre le rythme et les niveaux.</text>
  <text class="note" x="360" y="244" text-anchor="middle">10–20 s · effet sur le canal master · export MP4</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Un cadre montre un point focal clair entouré d'éléments secondaires discrets">
  <title>Mise en scène (staging)</title>
  <rect x="30" y="30" width="180" height="120" rx="8" fill="#f5f6f7" stroke="#c9ccd1" stroke-width="2"/>
  <circle cx="105" cy="90" r="30" fill="#b81c1c" opacity="0.9"/>
  <rect x="160" y="60" width="30" height="60" fill="#9aa0a6" opacity="0.5"/>
  <rect x="45" y="120" width="60" height="14" fill="#9aa0a6" opacity="0.35"/>
  <g stroke="#b81c1c" stroke-width="2" stroke-dasharray="4 4" fill="none">
    <circle cx="105" cy="90" r="42"/>
  </g>
  <text x="120" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f6368">un point focal, le reste en appui</text>
</svg>

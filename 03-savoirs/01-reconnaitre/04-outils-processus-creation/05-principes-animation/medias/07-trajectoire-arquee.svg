<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Une balle suit une trajectoire courbe plutôt qu'une ligne droite">
  <title>Trajectoire arquée (arcs)</title>
  <path d="M40 140 Q120 30 200 140" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="5 5"/>
  <circle r="15" fill="#b81c1c">
    <animate attributeName="cx" values="40;80;120;160;200" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;75;55;75;140" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f6368">le mouvement suit un arc, pas une droite</text>
</svg>

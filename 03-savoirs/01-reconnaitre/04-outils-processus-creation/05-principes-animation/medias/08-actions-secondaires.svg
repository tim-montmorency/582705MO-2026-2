<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Une action principale accompagnée d'une action secondaire discrète">
  <title>Actions secondaires</title>
  <line x1="20" y1="160" x2="220" y2="160" stroke="#c9ccd1" stroke-width="3"/>
  <circle cy="120" r="18" fill="#b81c1c">
    <animate attributeName="cy" values="120;60;120" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#2a6fdb" opacity="0.8">
    <animate attributeName="cx" values="112;128;112" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="112;52;112" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5f6368">une action principale, une qui l'accompagne</text>
</svg>
